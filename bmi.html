<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - NutriTrack</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bmi-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            max-width: 550px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        .height-inputs {
            display: flex;
            gap: 10px;
        }
        .calc-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .calc-btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 25px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 12px;
            text-align: center;
            display: none;
            border: 1px solid #e2e8f0;
        }
        
        /* Speed Meter Styles */
        .gauge-container {
            position: relative;
            width: 100%;
            height: 12px;
            background: linear-gradient(to right, #f59e0b 0%, #22c55e 35%, #f97316 70%, #ef4444 100%);
            border-radius: 6px;
            margin: 20px 0 10px 0;
        }
        .gauge-pointer {
            position: absolute;
            top: -6px;
            width: 4px;
            height: 24px;
            background: #0f172a;
            border-radius: 2px;
            left: 0%;
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modern Sleek Footer Styles */
        .site-footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 35px 8%;
            margin-top: 80px;
            border-top: 1px solid #1e293b;
            font-family: inherit;
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .footer-logo {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }
        .footer-logo span {
            color: var(--primary-color);
        }
        .footer-links-list {
            display: flex;
            gap: 25px;
            list-style: none;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }
        .footer-links-list a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .footer-links-list a:hover {
            color: #ffffff;
        }
        .footer-credit {
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">Nutri<span>Track</span></div>
        <div class="menu-toggle" id="mobile-menu">
            <span></span><span></span><span></span>
        </div>
        <nav class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="bmi.html" class="active" style="color: var(--primary-color);">BMI</a>
            <a href="guide.html">Guide</a>
            <a href="about.html">About</a>
            <a href="login.html" id="logoutBtn" style="background: #ef4444; color: var(--white); padding: 6px 18px; border-radius: 20px; font-weight: 600; text-decoration: none;">Logout</a>
        </nav>
    </header>

    <main style="padding: 130px 8% 80px 8%; min-height: 70vh;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 34px; font-weight: 800; color: var(--text-main);">Advanced BMI Calculator</h1>
            <p style="color: var(--text-muted); font-size: 16px; margin-top: 8px;">Calculate your Body Mass Index with interactive visual results.</p>
        </div>

        <div class="bmi-card">
            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" id="weightInput" placeholder="e.g. 70">
            </div>

            <div class="form-group">
                <label>Height Unit</label>
                <select id="unitSelect" onchange="toggleHeightInputs()">
                    <option value="cm">Centimeters (cm)</option>
                    <option value="ft">Feet & Inches (ft/in)</option>
                </select>
            </div>

            <div class="form-group" id="cmGroup">
                <label>Height (cm)</label>
                <input type="number" id="heightCm" placeholder="e.g. 175">
            </div>

            <div class="form-group" id="ftGroup" style="display: none;">
                <label>Height (Feet & Inches)</label>
                <div class="height-inputs">
                    <input type="number" id="heightFeet" placeholder="Feet (e.g. 5)">
                    <input type="number" id="heightInches" placeholder="Inches (e.g. 9)">
                </div>
            </div>

            <button class="calc-btn" onclick="calculateBMI()">Calculate BMI</button>

            <div class="result-box" id="resultBox">
                <h3 id="bmiValue" style="font-size: 26px; color: var(--text-main); margin-bottom: 5px;">-</h3>
                <p id="bmiCategory" style="font-weight: 700; font-size: 18px; margin-bottom: 5px;"></p>
                
                <!-- Speed Meter / Gauge Bar -->
                <div class="gauge-container">
                    <div class="gauge-pointer" id="gaugePointer"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 15px; font-weight: 600;">
                    <span>Under</span>
                    <span>Normal</span>
                    <span>Over</span>
                    <span>Obese</span>
                </div>

                <p id="bmiDetails" style="font-size: 14px; color: var(--text-muted); line-height: 1.5;"></p>
            </div>
        </div>
    </main>

    <!-- Modern Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <a href="index.html" class="footer-logo">Nutri<span>Track</span></a>
            <ul class="footer-links-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="bmi.html">BMI</a></li>
                <li><a href="guide.html">Guide</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="footer-credit">Designed by Mohsin</div>
        </div>
    </footer>

    <script>
        if (localStorage.getItem('nutriLoggedIn') !== 'true') { window.location.replace('login.html'); }
        document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.removeItem('nutriLoggedIn'); });

        function toggleHeightInputs() {
            const unit = document.getElementById('unitSelect').value;
            if (unit === 'cm') {
                document.getElementById('cmGroup').style.display = 'block';
                document.getElementById('ftGroup').style.display = 'none';
            } else {
                document.getElementById('cmGroup').style.display = 'none';
                document.getElementById('ftGroup').style.display = 'flex';
            }
        }

        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weightInput').value);
            const unit = document.getElementById('unitSelect').value;
            let heightM = 0;

            if (!weight || weight <= 0) {
                alert('Please enter a valid weight value.');
                return;
            }

            if (unit === 'cm') {
                const cm = parseFloat(document.getElementById('heightCm').value);
                if (!cm || cm <= 0) {
                    alert('Please enter a valid height in cm.');
                    return;
                }
                heightM = cm / 100;
            } else {
                const feet = parseFloat(document.getElementById('heightFeet').value) || 0;
                const inches = parseFloat(document.getElementById('heightInches').value) || 0;
                if (feet <= 0 && inches <= 0) {
                    alert('Please enter valid feet and inches.');
                    return;
                }
                const totalInches = (feet * 12) + inches;
                heightM = totalInches * 0.0254;
            }

            const bmi = parseFloat((weight / (heightM * heightM)).toFixed(1));
            
            let category = '';
            let color = '';
            let advice = '';

            if (bmi < 18.5) {
                category = 'Underweight';
                color = '#f59e0b';
                advice = 'A BMI below 18.5 indicates that you may be underweight. Consider consulting a nutritionist to build a healthy calorie surplus.';
            } else if (bmi >= 18.5 && bmi < 25) {
                category = 'Normal Weight';
                color = '#22c55e';
                advice = 'Congratulations! Your BMI is within the healthy and normal weight range. Maintain your balanced diet and lifestyle.';
            } else if (bmi >= 25 && bmi < 30) {
                category = 'Overweight';
                color = '#f97316';
                advice = 'A BMI between 25 and 29.9 indicates overweight status. Regular physical activity and mindful calorie tracking can help.';
            } else {
                category = 'Obese';
                color = '#ef4444';
                advice = 'A BMI of 30 or higher falls into the obese range. It is advisable to follow a structured nutrition plan and consult a healthcare expert.';
            }

            // Speed Meter Calculation (Assuming BMI visual range from 10 to 40 for the gauge)
            let percentage = ((bmi - 10) / (40 - 10)) * 100;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            const resultBox = document.getElementById('resultBox');
            const bmiValue = document.getElementById('bmiValue');
            const bmiCategory = document.getElementById('bmiCategory');
            const bmiDetails = document.getElementById('bmiDetails');
            const gaugePointer = document.getElementById('gaugePointer');

            resultBox.style.display = 'block';
            bmiValue.innerHTML = `Your BMI: <strong>${bmi}</strong>`;
            bmiCategory.innerText = category;
            bmiCategory.style.color = color;
            bmiDetails.innerText = advice;
            
            // Adding a small delay for the animation effect
            setTimeout(() => {
                gaugePointer.style.left = `${percentage}%`;
            }, 100);
        }
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('mobile-menu');
            var links = document.getElementById('nav-links');
            if (!toggle || !links) return;
            toggle.addEventListener('click', function (e) {
                e.stopPropagation(); links.classList.toggle('active'); toggle.classList.toggle('open');
            });
            document.addEventListener('click', function (e) {
                if (!links.contains(e.target) && !toggle.contains(e.target)) {
                    links.classList.remove('active'); toggle.classList.remove('open');
                }
            });
        })();
    </script>
    
</body>
</html>
