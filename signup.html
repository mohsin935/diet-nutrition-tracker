<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NutriTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">

    <div style="background: var(--white); padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 420px; border: 1px solid rgba(34, 197, 94, 0.2);">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-size: 28px; font-weight: 800; color: var(--text-main);">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 15px; margin-top: 5px;">Join NutriTrack and start your fitness journey</p>
        </div>

        <form id="signupForm" style="display: flex; flex-direction: column; gap: 18px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your name" required style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; font-size: 15px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Age</label>
                <input type="number" id="signupAge" placeholder="Enter your age" min="1" max="120" required style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; font-size: 15px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Email Address</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; font-size: 15px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)" minlength="6" required style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; font-size: 15px;">
            </div>
            <button type="submit" class="cta-button" style="width: 100%; margin-top: 5px; text-align: center;">Sign Up</button>
        </form>

        <p style="text-align: center; margin-top: 25px; font-size: 15px; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Login</a>
        </p>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        if (signupForm) {
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('signupName').value;
                const age = document.getElementById('signupAge').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;

                localStorage.setItem('nutriUserName', name);
                localStorage.setItem('nutriUserAge', age);
                localStorage.setItem('nutriUserEmail', email);
                localStorage.setItem('nutriUserPassword', password);

                alert('Account created successfully! Please login now.');
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
